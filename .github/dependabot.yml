version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      # These crates share digest / rand_core versions and must be upgraded together.
      rustcrypto-and-rand:
        patterns:
          - "chacha20poly1305"
          - "ed25519-dalek"
          - "x25519-dalek"
          - "hkdf"
          - "hmac"
          - "sha2"
          - "subtle"
          - "zeroize"
          - "rand"
          - "rand_*"
      cargo-other:
        patterns:
          - "*"
  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
