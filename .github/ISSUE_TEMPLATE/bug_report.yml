name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Security vulnerabilities must not be filed here. Use the private reporting link.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands, policy file, scenario name.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "pathguard 0.1.0 or git sha"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Rust version and OS
