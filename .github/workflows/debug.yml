name: debug
on: [push]
jobs:
  dbg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: build and report
        run: |
          cargo --version > out.txt 2>&1
          cargo build --all-targets --locked >> out.txt 2>&1 || true
          msg=$(grep -E -A6 '^(error|warning: unused)' out.txt | head -c 1800 | sed ':a;N;$!ba;s/\n/%0A/g')
          [ -z "$msg" ] && msg=$(tail -c 1500 out.txt | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=buildlog::$msg"
