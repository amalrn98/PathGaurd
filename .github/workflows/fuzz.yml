name: Fuzz

# Coverage-guided fuzzing needs nightly Rust, so it runs on a schedule and on demand rather
# than on every push. The deterministic fuzz smoke test (tests/fuzz_smoke.rs) runs in CI.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        default: "60"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [message_decode, receiver_handle, policy_toml, canary_service_request, canary_scan]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master as of 2026-11-15
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      - name: Fuzz
        run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=${{ inputs.seconds || 60 }} -rss_limit_mb=1024
      - name: Keep crashing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
