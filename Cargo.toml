[package]
name = "pathguard"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Experimental decoy-assisted, authenticated data transmission protocol: verify the path, then release the payload."
license = "Apache-2.0"
repository = "https://github.com/amalrn98/PathGaurd"
readme = "README.md"
keywords = ["security", "protocol", "decoy", "interception-detection", "cryptography"]
categories = ["cryptography", "network-programming"]

[lib]
name = "pathguard"
path = "src/lib.rs"

[[bin]]
name = "pathguard"
path = "src/main.rs"

[dependencies]
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = "2"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"
subtle = "2"
zeroize = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
